<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: 105mm 148mm;
            margin: 0;
        }

        body {
            margin: 0;
        }

        .dog-card {
            width: 105mm;
            height: 148mm;
            box-sizing: border-box;
            break-after: page;
        }

            @font-face {
        font-family: 'CenturyGothic';
        src: url("{{ STATIC_ROOT }}/fonts/centurygothic.ttf") format('truetype');
    }
    body {
        font-family: 'CenturyGothic', Arial, sans-serif;
    }
    .sheet {
        display: grid;
        grid-template-columns: 105mm 105mm;
        grid-template-rows: 148.5mm 148.5mm;
    }

    .dog-card {
        width: 105mm;
        height: 148.5mm;
        box-sizing: border-box;
    }
    .clearfix { clear: both; }
    .card {
    background: white;
    border: 2px solid #555;
    border-radius: 2px;
    padding: 12px;
    box-sizing: border-box;
}

    .card h1 {
        color: #b87a41;
        font-size: 35px;
        line-height: 1.1;
        text-align: center;
        margin: 8px 0;
    }

    .card p {
        font-size: 14px;
        line-height: 1.2;
        color: black;
        margin: 5px 0;
    }

    .photo {
        display: block;
        width: 60%;
        height: 65mm;
        object-fit: cover;
        box-sizing: border-box;
        border: 3px solid #b87a41;
        border-radius: 2px;
        margin: auto;
    }

    .card p.caretaker {
        font-size: 14px;
        line-height: 1.2;
        overflow-wrap: anywhere;
        white-space: normal;
    }

    .card p.dangerous {
        color: #e00000;
        font-size: 15px;
        font-weight: bold;
        text-align: center;
        margin: 5px 0;
    }

    hr {
        border: none;
        background: #ff1010;
        height: 2px;
        margin: 1px 0;
    }

    .qr-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1mm;
    }

    .qr-block.qr-dangerous {
        flex-direction: row;
        gap: 1mm;
    }
    .qr-block img {
        width: 25mm;
        height: 25mm;
    }
    </style>
</head>
<body>
    {% for card in cards %}
        {% include "pdf/dog_card_content.html" %}
    {% endfor %}
</body>
</html>
